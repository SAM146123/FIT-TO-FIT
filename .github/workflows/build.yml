name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project folder
        id: find
        run: |
          if [ -f FitToFit-project.zip ]; then unzip -oq FitToFit-project.zip -d _unzipped; fi
          F=$(find . -name settings.gradle.kts -not -path "./_unzipped/*" | head -1)
          if [ -z "$F" ]; then F=$(find . -name settings.gradle.kts | head -1); fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          - name: Use google-services.json
        run: |
          if [ -f google-services.json ] && python3 -c "import json;json.load(open('google-services.json'))"; then cp google-services.json "${{ steps.find.outputs.dir }}/app/google-services.json"; else echo "google-services.json is missing or invalid, using the one inside the zip"; fi
       - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FitToFit-apk
          path: "**/build/outputs/apk/debug/*.apk"
