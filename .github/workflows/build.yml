name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q FitToFit-project.zip
      - name: Use compileSdk 35
        run: |
          sed -i 's/compileSdk = 34/compileSdk = 35/' FitToFit/app/build.gradle.kts
          echo "android.suppressUnsupportedCompileSdk=35" >> FitToFit/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: FitToFit
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FitToFit-apk
          path: FitToFit/app/build/outputs/apk/debug/app-debug.apk
