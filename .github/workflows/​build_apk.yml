name: Build FitToFit APK v2.0
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project folder
        id: find
        run: |
          if [ -f FitToFit-project.zip ]; then unzip -oq FitToFit-project.zip -d _unzipped; fi
          F=$(find . -name settings.gradle.kts -not -path "./_unzipped/*" | head -1)
          if [ -z "$F" ]; then F=$(find . -name settings.gradle.kts | head -1); fi
          echo "Project folder: $(dirname "$F")"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FitToFit-APK
          path: "**/build/outputs/apk/debug/*.apk"
